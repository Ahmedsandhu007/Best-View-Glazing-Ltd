<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign in - Best View Glazing dashboard</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap"><link rel="icon" href="/static/icon.svg" type="image/svg+xml"><link rel="stylesheet" href="/static/style.css"></head>
<body class="login">
<main>
  <form class="card narrow" method="post" action="/login">
    <img src="/static/logo-dark.svg" alt="Best View Glazing Ltd" class="loginlogo"><h1>OnBuy dashboard</h1>
    <p class="muted">Controls the five OnBuy stores. Enter the owner password (<code>DASHBOARD_PASSWORD</code> on the machine that runs it) or your own employee code.</p>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <label>Password or employee code <input type="password" name="password" autofocus autocomplete="current-password"></label>
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">Sign in</button>
  </form>
</main>
</body>
</html>
